name: Maximized Stable Ubuntu Environment
image: ://microsoft.com

# Инструкция для Codespaces запрашивать расширенное хранилище, если доступно
features:
  ghcr.io/devcontainers/features/common-utils:2:
    configureZshAsDefaultShell: true

# Автоматический запуск процессов с правами администратора
updateContentCommand: sudo apt-get update && sudo apt-get install -y git curl

# Настройки VS Code внутри Codespace для оптимизации скорости
customizations:
  vscode:
    settings:
      "workbench.startupEditor": "none"
      "telemetry.telemetryLevel": "off"
      "git.autorefresh": false
    extensions:
      - eamodio.gitlens

